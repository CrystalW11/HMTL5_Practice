<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation and Input Constraints</title>
</head>
<body>
    <form action="/submit" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br>
        <br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phonenumber" pattern="[0-9]{10}" title="Please enter a 10-digit phone number" required>

        <br>
        <br>

    <input type="submit" value="Submit">


    </form>
</body>
</html>
