<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merging cells with rowspan and colspan</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Full Name</th>
            <th>Department</th>
        </tr>
        <tr>
            <td rowspan="2">Thomas</td>
            <td>HR</td>
        </tr>
        <tr>
            <td>Finance</td>
            
        </tr>
    </table>
</body>
</html>
