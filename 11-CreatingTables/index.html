<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Tables with Table Tr Td and th</title>
</head>
<body>
    <table border="1">
        <tr>
            <th colspan="1"> Full Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Camelia Johnson</td>
            <td>22</td>
        </tr>

        <tr>
            <td rowspan="2">Zara Shield</td>
            <td>26</td>
        </tr>
        
    </table>
</body>
</html>
